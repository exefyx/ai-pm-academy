const data=[
['AI 与机器学习基础','理解不同 AI 技术适用的业务问题','AI 不是所有问题的最优解。确定性计算优先用规则或代码；有历史标签的预测任务可以用监督学习；开放式语言理解与生成适合考虑 LLM。训练集用于学习，验证集用于选择参数，测试集用于独立评估。','需求 → 判断任务类型 → 选择技术 → 验证效果','用 GMV 对账为例，金额计算使用 Python，异常原因解释才考虑大模型。',['AI|人工智能|人工智能是一类让系统完成识别、预测、决策或生成等任务的方法。例：售后系统可用 AI 识别来信意图，用确定性的业务规则计算退款金额。产品上应先明确任务需要哪种能力，再选技术。','ML|机器学习|机器学习用已有数据拟合规律，再把规律用于未见样本。例：根据历史订单的金额、渠道和异常标签训练模型，给新订单打风险分。上线前要检验训练数据能否代表未来订单。','DL|深度学习|深度学习通过多层神经网络逐层学习数据表示。例：票据识别模型可从像素学习边缘、字形和版面，再输出字段。做选型时要同时衡量识别效果、数据成本和部署资源。','AIGC|生成式 AI 内容|AIGC 指利用生成式 AI 生成或改写文本、图片、音频等内容。例：给商品图和卖点生成三版海报文案，再由运营审核事实与品牌措辞。验收要覆盖事实、版权素材来源与输出可用性。','NLP|自然语言处理|自然语言处理研究如何分析、理解和生成文本或语音转写后的语言。例：把客服消息分成退款、物流和商品咨询，再提取订单号。分类和实体提取可以独立评估，便于定位失败环节。','CV|计算机视觉|计算机视觉从图像或视频提取有用信息，可做分类、检测、分割和文字识别。例：质检时既要识别商品是否破损，也可能要标出破损位置。两种目标分别对应分类与定位任务。','Multimodal|多模态|多模态系统能处理文本、图像、音频等不止一种信息形式，可以组合输入或输出。例：售后助手结合用户的破损照片和订单描述起草处理建议。测试时应覆盖图片模糊、缺失及文字与图片冲突。','Supervised Learning|监督学习|监督学习用输入与目标标签的配对样本拟合映射。例：给历史工单标注退款、物流和投诉类别，再训练自动分流模型。标注口径不一致会让模型学到互相冲突的规则。','Unsupervised Learning|无监督学习|无监督学习在没有目标标签的情况下，从数据中寻找结构。例：把大量工单按文本特征分成若干相似群，再由运营给每群命名。群组能否支撑产品决策仍需要人工检查。','Reinforcement Learning|强化学习|强化学习让智能体在环境中选择动作并接收奖励，目标是优化长期累计回报。例：在模拟库存环境中学习补货策略，奖励同时计入缺货和积压成本。只奖励销量可能学出库存成本过高的策略。','Classification|分类|分类为输入预测一个或多个离散标签。例：将工单分为物流、售后或咨询，也可同时标记「退款」和「紧急」。上线前应按类别检查错分代价，例如紧急投诉漏分的影响。','Regression|回归|回归预测连续数值。例：根据线路、天气和包裹信息估计配送时间为 3.4 小时。验收时可看平均绝对误差，也要检查偏远地区是否有系统性低估。','Clustering|聚类|聚类依据选定特征和距离，将相似样本分组。例：用工单文本向量发现重复咨询主题。簇数和特征不同可能得到不同分组，需要抽样检查每组是否有可行动的共同问题。','Training Set|训练集|训练集用于拟合模型参数。例：以过去六个月标注过的工单训练分流模型。拆分数据时应处理重复工单和同一会话，避免它们同时进入训练和评估数据而抬高分数。','Validation Set|验证集|验证集用于比较候选模型、超参数和分类阈值。例：在验证集上选择风险分阈值，在漏检与人工复核量之间取舍。反复依据它调优后，最终成绩仍要用独立测试集报告。','Test Set|测试集|测试集在方案确定后用于估计对未见样本的表现。例：用后续月份的工单评估已选定的模型和阈值。若看过测试结果又改模型，应另外准备独立数据做最终检查。','Overfitting|过拟合|过拟合是模型过度贴合训练样本中的噪声或偶然规律，导致新样本表现下滑。例：训练题正确率 99%，换一批自然问法却只有 70%。可先检查数据重复，再用验证集比较更简单的方案。','Generalization|泛化|泛化指模型把学到的规律应用到未见数据的能力。例：退款分类在新门店、新月份和不同措辞上仍然可靠。可分时段、渠道和人群报告表现，避免整体平均掩盖薄弱场景。','Loss Function|损失函数|损失函数把模型预测偏离目标的程度变成训练可以优化的数值。例：配送预测可惩罚 ETA 与真实送达时间的偏差。训练损失下降后，仍要检查用户更在意的超时比例是否改善。','CNN|卷积神经网络|卷积神经网络用可复用的局部滤波器在图像等网格数据上提取特征，多层特征可由边缘组合成纹理和形状。例：检查商品图的划痕时，要用不同光线与拍摄角度测试漏检率。'],['精确计算订单差额应该优先使用什么？','大模型自由生成','Python 确定性计算','图像分类',1,'金额对账需要可重复、可审计的精确结果。']],
['大语言模型 LLM','理解模型原理、参数与选型','生成式 LLM 将输入切分为 Token，通过 Transformer 处理上下文并预测后续 Token。模型参数是训练得到的权重；上下文窗口是单次处理的信息容量。生成概率不等于事实真实性，因此需要评估与外部依据。','输入 → Tokenization → Transformer → 解码 → 输出','在 Ollama 中使用同一批问题比较不同可运行模型的质量、延迟和资源占用。',['LLM|大语言模型|大语言模型是在大规模语料上训练的模型。常见的生成式 LLM 会根据指令、对话和已生成的内容，逐步预测下一个词元，从而完成摘要、问答或信息提取。例：它可以把客服对话整理成「问题—原因—处理结果」，但也可能补出原文没有的原因，因此质检页应保留原文证据。','Token|词元|词元是模型读入和生成文本的单位。它可能是完整单词、词的一部分、标点或字节片段，具体切法由分词器决定。例：同一份中英混合客服记录换一个模型后，词元数可能变化。估算上下文、生成长度和按词元计费的成本时，应按目标模型实测。','Tokenizer|分词器|分词器把文本按模型的词表和切分规则编码成一串整数 ID，也能把生成的 ID 序列解码回文本。模型读取的是这些 ID。例：产品要给批量导入的工单做长度限制，应使用目标模型的分词器计数，尤其要测中文、表情和长编号。','Transformer|模型架构|Transformer 是一类神经网络架构，通常把位置处理、注意力和前馈网络叠成多层。常见生成式 LLM 使用仅解码器架构，预测下一词元时只能使用已在上下文中的信息。例：总结一段工单时，模型可以把末尾的「已退款」和前面提到的订单关联起来。','Attention|注意力机制|注意力让模型更新某个词元的表示时，对可见的其他词元分配权重，再汇总它们的信息。不同注意力头可以学习不同的关联。例：看到「这笔款已退」时，模型可以利用前文的订单号理解「这笔款」指什么。注意力权重不能直接当成可靠的业务证据。','Parameter|模型参数|模型参数是训练过程中调整、保存在模型里的数值，例如权重。标称 7B 通常表示约 70 亿个参数。例：本地部署时可用参数量和精度初步估算权重需要多少显存，再实测长输入和并发。选型还要比较任务正确率，参数更多并不保证更适合。','Context Window|上下文窗口|上下文窗口是模型在一次推理中能处理的词元范围。系统指令、聊天历史、检索片段和输出所占预算要按接口规则核算，有些服务还另设最大输出长度。例：做长合同问答时，应优先检索相关条款，留出回答空间，并测试关键信息放在文档中间时是否容易漏掉。','Embedding|向量嵌入|嵌入模型把一条查询或一段文本转换成一个数值向量，检索系统可比较向量的相似度来找意思接近的内容。例：「钱什么时候退」可以匹配到未出现原句的「退款到账时效」条款。遇到订单号和 SKU 等必须精确匹配的字段，通常还需要关键词或字段过滤。','Pre-training|预训练|预训练是在大量数据上训练基础模型的阶段。许多生成式 LLM 用预测下一词元的目标，让模型获得语言和文本续写能力。例：基础模型可能了解一般退款流程，企业刚更新的退款时限适合由可维护的知识库提供，再要求模型给出依据。','SFT|监督微调|监督微调使用带目标输出的示例继续训练模型，使它更常按照示例完成任务。例：用「客服对话 → 标准工单 JSON」样本训练工单助手，重点检查字段遗漏和格式错误是否减少。SFT 是微调的一种，效果依赖示例是否覆盖真实输入和例外情况。','Fine-tuning|微调|微调是在已有模型上继续训练，更新全部或一部分参数，让模型适应某个领域、任务或输出习惯。例：如果客服摘要经常写得像原文复述，可以用人工审核过的优质摘要微调，并拿没参与训练的对话做对照评估。频繁更新的业务规则更适合放进可追溯的知识库。','LoRA|低秩适配|LoRA 通常冻结基础模型权重，在选定层加入低秩的可训练矩阵，用较少的可训练参数来学习任务所需的权重变化。例：在有限显存上训练一个工单分类适配器，再与原模型比较分类准确率和推理耗时。适配器仍依赖相匹配的基础模型。','RLHF|基于人类反馈的强化学习|RLHF 利用人类反馈来调整模型行为。一种常见做法是让标注者比较多个回答，用偏好数据训练奖励模型，再用强化学习提高人类偏好的输出获得的奖励。例：客服场景可偏好有依据、措辞得体且不越权承诺的回答。偏好标准有漏洞时，模型可能学会迎合评分。','DPO|直接偏好优化|DPO 使用同一输入下被选中与被拒绝的回答进行训练，通常相对于参考模型，提高被选中回答的相对概率。它无需单独训练奖励模型来跑在线强化学习。例：同一退款请求中，优先选择准确引用政策的回答，拒绝擅自承诺到账日期的回答。','Hallucination|幻觉|幻觉指模型生成看似可信、实际错误或缺乏依据的内容。例：知识库说「按支付渠道处理」，助手却自信地说「一律 24 小时到账」。评估时可分别查答案是否符合事实、能否由引用资料支持，并测试模型在缺少依据时是否会说明不确定。','Inference|推理|推理指用已训练的模型处理输入并得到输出，通常不更新训练得到的权重。对于常见生成式 LLM，服务先处理输入，再逐步生成输出词元。例：测客服助手时，分别看首词元时间和完整回答耗时，因为流式显示可以改善等待体验，但两者变化未必一致。','Temperature|温度|温度是生成时调节下一个词元采样分布的参数。温度较低时，结果通常更集中在高概率候选上；较高时，低概率候选更有机会被选中。例：批量生成营销文案可尝试较高温度获取不同措辞。事实问答即便使用低温度，也需要核对依据。','Top-p|核采样|Top-p 是生成时按累计概率筛选候选词元的方法：从概率高到低保留累计概率达到阈值的最小候选集合，再从中采样。例：概率为 0.60、0.25、0.10、0.05 时，Top-p 为 0.8 会保留前两个候选。候选数量会随每一步的分布变化。','MoE|混合专家|MoE 在模型的某些层设置多个专家网络，由路由器为各词元选择其中少数专家参与计算。例：选型表中若同时给出总参数与每词元激活参数，前者影响部署需要容纳多少权重，后者关系到单次计算量。实际延迟还取决于路由、硬件和跨设备通信。','Quantization|量化|量化用较低精度表示模型权重，有些方案也会处理激活值或缓存。例：把模型权重从 16 位量化为 4 位，通常能降低显存占用，让模型在资源有限的设备上运行。速度和质量变化要用目标硬件与真实任务实测，重点看专有名词、数字和结构化输出。','Distillation|蒸馏|蒸馏让学生模型通过教师模型提供的输出、概率分布或其他训练信号学习，常用于以更低成本保留特定任务上的能力。例：用较强模型生成并审核工单分类样本，训练较小的线上分类模型，再用真实长尾工单和人工标签检查它是否继承了教师的错误。'],['降低 Temperature 能保证消除幻觉吗？','能','不能','只要模型足够大就能',1,'降低随机性不等于提高事实真实性。']],
['Prompt 工程','控制输出结构与行为','好的提示词包含角色、任务、上下文、约束、输出格式和示例。将提示词作为可版本化的产品配置，通过固定测试集比较效果。结构化输出还需要程序校验，不能只依靠文字要求。','角色 → 任务 → 背景 → 约束 → 格式 → 测试','在 Dify 设计运营助手 Prompt，要求输出结论、依据和不确定性；比较两个版本。',['Prompt|提示词|提示词是一次模型任务中提供的指令、背景、约束或示例。例：要求总结客服对话为「诉求、处理结果、待跟进项」三栏，并规定证据不足时写「待确认」。用代表性输入比较不同版本。','System Prompt|系统提示词|系统提示词通常由应用设置，用于给模型提供角色、长期任务规则和输出约束。例：客服助手应引用已提供的政策，退款操作需确认。真正的授权与审批还需由应用后端执行。','User Prompt|用户提示词|用户提示词是用户本轮提供的任务和信息。例：「提取这段工单里的订单号，找不到就留空。」产品可把上传内容与用户指令分开传入，并明确附件正文属于待处理的数据。','Zero-shot|零样本|零样本提示只描述任务与输出要求，不在本次提示中提供示范。例：直接要求把工单分成「物流、退货、其他」。它适合建立低成本基线，再用真实输入验收边界类别。','Few-shot|少样本|少样本提示在上下文中加入少量输入输出示范，帮助模型理解格式和边界。例：加入一条真正的退款申请和一条仅咨询退款政策的对照示例，降低混淆。示例应代表真实业务情况。','CoT|思维链|思维链是一类通过中间推理步骤帮助模型处理多步任务的方法。例：账单分析可拆成「提取金额、核对字段、判断差异」，并要求交付可核查的计算结果和引用。验收应以结果和独立证据为准。','Prompt Template|提示词模板|提示词模板把稳定指令和动态变量分开，可以复用并进行版本管理。例：固定客服摘要字段，把每次的「对话内容」和「语言」填入变量。发布前要测试空变量、长文本以及模板升级。','Structured Output|结构化输出|结构化输出将模型结果约束为可程序读取的结构，例如固定 JSON 字段和枚举。例：工单输出包含类别、订单号和证据片段。应用仍需检查字段是否符合业务事实，处理拒答和校验失败。','JSON Schema|JSON 模式|JSON Schema 用声明式规则描述 JSON 的类型、必填字段、枚举和范围。例：要求工单的 category 为指定值，orderId 可以为空。结构校验能发现非法字段，但订单号是否属于该用户还需业务校验。','Guardrails|防护机制|防护机制是在输入、检索、工具调用或输出各环节执行的检查与限制。例：客服助手可过滤越权资料、限制可调用的工具，并对发起退款设置确认。设计时要给拦截结果配上恢复路径。','Prompt Injection|提示词注入|提示词注入是外部输入或检索文档把其中的文字伪装成指令，试图改变应用原本的任务。例：检索到的网页夹带与摘要无关的操作要求。应把正文视为数据，并在工具层做权限与确认。'],['要求 AI 输出 JSON 后，还应该做什么？','无需检查','程序校验格式和字段','只提高温度',1,'模型仍可能生成不合规数据，应进行校验和异常处理。']],
['RAG 与知识库','让答案具备可追溯依据','RAG 在生成前检索外部知识。离线阶段解析文档、切分、向量化并建立索引；在线阶段检索、可选重排并把资料交给模型。RAG 不修改模型权重，适合频繁更新的知识。','文档 → 切分 → 向量索引 → 检索 → 重排 → 生成','导入公开或模拟的运营制度，设置检索参数，用有答案与无答案的问题验证引用和拒答。',['RAG|检索增强生成|检索增强生成先从外部资料查找与问题相关的片段，再把片段和问题一起交给模型生成回答。例：员工问出差标准时先按地区和生效日期检索制度，再列出引用。排查时分开检查是否检到证据和是否用对证据。','Knowledge Base|知识库|知识库是供检索使用的受管理内容集合，通常包括原文、索引、版本和权限信息。例：报销政策变更后应更新对应文档并标记旧版本的有效期，避免两份相互冲突的制度同时出现在回答中。','Parsing|解析|解析从 PDF、网页、图片或表格提取可供后续处理的文字和结构。例：费用表的金额必须与城市行名一起保留，扫描件可能需要 OCR。可抽查解析结果与原文件是否一致再建索引。','Chunk|文本块|文本块是从源文档切出、可独立索引或返回的片段。例：把差旅制度按小标题切分，并让每块携带标题和条款位置。只有半句或缺失适用范围的片段很难支撑可靠回答。','Chunk Size|分块大小|分块大小是文本块的目标长度，常按词元或字符衡量，也可结合标题结构。例：短块容易命中特定条款，长块能保留例外情况但会占用更多上下文。用典型问题比较证据召回和回答质量。','Chunk Overlap|分块重叠|分块重叠是相邻文本块共享的一段内容，用于减少跨边界信息被切散。例：将上一块末尾的「试用期员工」保留到下一块的报销说明。重叠过大可能挤占候选位置，应检测重复证据。','Embedding Model|向量模型|嵌入模型把文本或图像映射成用于相似度搜索的数值向量。例：用语义向量检索「快递退回后多久到账」对应的退款条款。更换模型后，通常需要重算文档向量并重新测召回效果。','Vector Database|向量数据库|向量数据库存储向量，并可基于距离或相似度快速查找近邻，常支持元数据过滤。例：先限制可访问的部门，再找相近制度段落。它负责找候选，业务应用需决定如何核对权限和生成答案。','Semantic Search|语义检索|语义检索依据查询与内容的语义接近程度找结果，常用向量实现。例：「能不能退差价」可能匹配「价格保护」。测试集应包含同义改写，也应检查概念接近但政策不同的干扰项。','Keyword Search|关键词检索|关键词检索依据词项匹配和权重给文档排序。例：查询型号 X123、合同号或专用术语时，字面匹配通常很有价值。用户只说俗称或同义句时，需要同义词扩展或其他检索信号。','Hybrid Search|混合检索|混合检索将关键词与语义等多个检索信号合并，再对候选排序。例：查询「X123 怎么退款」时，用关键词保留型号匹配，用语义查找售后条款。融合权重应根据真实查询集调优。','Similarity|相似度|相似度是两个表示有多接近的分数，向量检索常用余弦相似度等指标。例：「退运费」可能和「退货运费」很相似。分数高只表示匹配信号较强，还要确认资料是否真正回答了问题。','Top-K|前 K 个|Top-K 指某阶段保留排名最靠前的 K 个结果。例：先检索 30 段，再重排并交给模型前 5 段。增大 K 能覆盖更多候选，也会增加延迟、重复和干扰，需要分阶段选择。','Rerank|重排序|重排序是用更细的相关性模型或业务规则重新排列初筛候选。例：从 50 段政策中优先选择同时符合地点、日期和问题意图的条款。初筛没有找回的文档无法由重排补出。','Metadata|元数据|元数据是描述内容的字段，例如来源、版本、生效日、所属组织和访问权限。例：回答某城市差旅标准前先按地区与日期筛选。建库时要明确字段缺失如何处理，权限字段尤其需要校验。','Query Rewrite|查询改写|查询改写把自然对话改成更易检索的查询。例：结合上文把「那试用期呢」改为「试用期员工差旅报销资格」。需保留否定、时间和限定条件，避免改写后偏离原问题。','Citation|引用|引用标明回答所依赖的证据来源，常包含文档、条款和链接。例：在「住宿上限」后列出生效制度的页码与原句。验收要核查链接可打开，且被引用片段真的支持相应结论。','Groundedness|有据性|有据性衡量回答中的主张能否从本次提供的资料得到支持。例：从退款政策里逐句核对时限、适用渠道和例外。资料本身若已过期，答案可能有据但仍不符合现行规则。'],['公司报销政策频繁更新，优先采用哪种技术？','每次重新预训练','RAG','提高 Temperature',1,'更新知识库比反复训练模型更适合此场景。']],
['Agent 与 Workflow','设计多步骤 AI 任务','Workflow 的主要执行路径由设计者定义；Agent 可以根据目标和工具反馈动态决策。优先选择满足需求且可控的方案。涉及写入、发送或付款时应设计权限、人工确认、重试上限和审计。','目标 → 规划 → 工具调用 → 反馈 → 检查 → 完成','用 Dify 搭建上传订单表、代码核对、LLM 解释、报告输出的工作流。',['Agent|智能体|智能体是应用中能根据目标、当前状态和工具反馈选择下一步的系统。例：售后助手先查订单，结果缺失时向用户追问，信息齐全后再建议方案。上线应限定工具权限、步数和停止条件。','Workflow|工作流|工作流把任务写成预先设计的节点、条件和执行路径。例：上传账单后先校验字段，再计算差额，最后由模型解释异常。每个节点都可独立检查输入、输出以及失败时如何处理。','Planning|规划|规划是根据目标和已有信息，决定步骤、依赖和验证方式。例：生成销售周报前先确认日期、拉取订单和退款，再检查金额口径。工具返回缺失数据时，应更新计划或说明无法完成的部分。','Task Decomposition|任务拆解|任务拆解是把复杂目标拆成可执行、可验收的小任务。例：把「解释退款率上升」拆成口径确认、渠道分组、异常定位和证据核对。每一步应有明确产出，便于定位错误。','Tool Calling|工具调用|工具调用让应用根据模型提出的请求，通过受控接口执行外部操作或读取资料，再把结果交回。例：助手提交订单号查询物流。应用需负责校验参数、执行权限和错误处理。','Function Calling|函数调用|函数调用是工具调用的一种接口形式，模型按预定义签名返回函数名和结构化参数，由应用选择是否执行。例：模型提出查询某个订单的请求，服务端先检查用户是否有权读取该订单。','Memory|记忆|记忆指应用保存并在后续交互中有选择地取回历史信息。例：保存用户同意保留的报表语言偏好，下次生成时再注入。设计时要明确保存哪些数据、多久过期，以及用户如何删除。','ReAct|推理与行动|ReAct 将模型的任务判断与外部行动交错执行，再根据工具观察结果决定下一步。例：先查订单状态，结果显示已取消后调整路径并查询退款。应设置步数上限，并保留可审计的工具结果。','Multi-Agent|多智能体|多智能体方案把不同职责交给多个智能体，通过消息或共享状态协调。例：一个整理销售数据，一个核对口径，最后汇总可追溯结果。应明确冲突裁决者和总延迟预算，避免反复交接。','MCP|模型上下文协议|模型上下文协议是连接 AI 应用和外部能力的开放协议，可统一发现与使用工具、资源和提示模板。例：学习助手通过 MCP 获取课程目录。协议提供连接方式，应用仍需处理身份、权限和用户确认。','Human-in-the-loop|人在回路|人在回路指把人工确认、纠错或接管放进关键执行节点。例：助手起草退款方案，审核员核对金额与证据后才执行。审批界面应展示动作影响、依据和可编辑项，并记录决定。','Fallback|降级方案|降级方案是在主路径不可用或结果不可信时，切换到较稳妥的可服务路径。例：知识检索超时后显示相关帮助页面并提供人工客服入口。降级结果应让用户看清哪些信息尚未核实。','Retry|重试|重试是遇到临时故障后再次执行操作，可用退避和次数上限减少压力。例：只读物流查询遇到网络超时可稍后再试。涉及创建或退款等写操作时，应通过幂等键或状态查询防止重复执行。','Router|路由|路由根据输入、规则或模型判断把任务交给合适的流程、模型或人员。例：订单咨询走查询流程，账号异常走人工核验。需要设计判断不确定时的去向，并跟踪误路由率。','State|状态|状态是任务当前阶段及继续执行所需的结构化信息，例如已完成步骤、结果和审批状态。例：退款流程记录「已核对金额、等待批准」，系统重启后可从该节点继续。'],['固定的财务对账流程优先采用什么？','完全自主 Agent','确定性 Workflow','无任何检查的聊天机器人',1,'固定流程更易测试、控制和审计。']],
['AI 效果评估','建立可复现的效果证据','评估需要区分检索质量、答案质量、任务成功率与工程性能。建立黄金测试集，定义评分规则，对失败案例分类并优化。LLM-as-a-Judge 可以辅助人工评估，但也需要校准。','测试集 → 基线 → 评估 → Bad Case → 优化 → 回归测试','建立至少50道测试题，记录正确性、有据性、拒答、延迟；用同一测试集对比两个版本，保留原始记录。',['Accuracy|准确率|准确率是全部样本中预测正确的比例。例：100 张工单分对 92 张，准确率是 92%。若 95% 都是普通工单，全部判普通也能拿到 95%，仍需看稀有类别的召回率。','Precision|精确率|精确率是被判为正例的样本中，实际为正例的比例。例：系统标出 20 张高风险工单，其中 15 张确实高风险，精确率为 75%。这个指标帮助估算人工处理的误报负担。','Recall|召回率|召回率是真实正例中被系统找到的比例。例：共有 25 张高风险工单，模型识别出 15 张，召回率为 60%。漏掉高风险工单代价较大时，应重点跟踪这个指标。','F1|F1分数|F1 是精确率和召回率的调和平均，公式为 2×精确率×召回率÷两者之和。例：精确率 75%、召回率 60% 时，F1 约 66.7%。多分类报告应注明使用宏平均、微平均还是加权平均。','Correctness|正确性|正确性检查回答的事实、数字和推论是否符合真实情况或标准答案。例：助理给出的退款金额应与订单和实际到账记录核对。即使答案引用了资料，也要检查资料是否适用和有效。','Groundedness|有据性|评估有据性时，把回答拆成可核对的主张，再逐条判断所给资料是否支持。例：退款时限有条款支持，但「免退运费」找不到依据，可按评分规则记为部分有据。','Faithfulness|忠实性|忠实性关注输出是否保留源资料的意思，不擅自增添或改变关键条件。例：制度写「部分订单可退」，摘要写成「全部订单可退」，就遗漏了重要限定。评审可按主要条件和例外逐条核对。','Answer Relevance|答案相关性|答案相关性衡量回答是否切中用户的问题和约束。例：用户问「什么时候到账」，详细解释如何发起退款也可能答非所问。评审前可先列出用户明确问到的事项，再检查是否逐一回应。','Completeness|完整性|完整性检查回答是否覆盖任务要求的所有必要信息。例：用户问退款资格、步骤和时限，回答只给步骤仍有缺项。评分标准可提前列出必答项与加分项，避免把篇幅当作完整度。','Task Success Rate|任务成功率|任务成功率是按预先定义的端到端条件完成的任务数除以总尝试数。例：报表任务只有生成文件、核对数字且用户能下载才算成功。应事先规定如何计入中断、重试和人工接管。','Hallucination Rate|幻觉率|幻觉率是在明确判断规则和分母后，统计错误或无依据生成内容的比例。例：以回答为单位，100 条回答中有 8 条含无依据断言，幻觉率为 8%。比较版本时应使用相同粒度和数据。','Golden Dataset|黄金测试集|黄金测试集是经过审核、含标准答案或评分依据的代表性用例集合。例：整理正常退款、过期政策、无答案和越权查询等问题并附证据。保留版本，避免把最终测试题用于调优。','Benchmark|基准测试|基准测试在统一的任务、数据、运行配置和评分规则下比较模型或版本。例：用相同工单和温度比较正确率、P95 延迟与单次成本。公开榜单高分仍需用本业务样本验证。','LLM-as-a-Judge|模型裁判|模型裁判用大模型按评分量表评审输出，可打分、比较或给出理由。例：评估退款回答是否引用正确条款。上线前用人工样本校准，检查模型是否偏好更长的回答或特定展示顺序。','Bad Case Analysis|失败案例分析|失败案例分析通过回看输入、日志和证据定位失败原因。例：答案错误可能来自资料缺失、排序靠后或模型误读。归因后按频率和影响决定先修哪一层，并补回归用例。','Regression Testing|回归测试|回归测试验证修改后既有能力仍满足验收线。例：改善物流问答后，用固定用例重新检查退款、拒答和越权场景。比较前后指标并保留失败样本，便于复现。','A/B Testing|对照实验|A/B 测试将合适的实验单位随机分配到对照和实验版本，按预先约定的指标比较效果。例：比较两种客服入口对解决率的影响，同时跟踪投诉率。需留意样本量和同一用户串组。','TTFT|首词元时间|首词元时间是从请求发出到收到第一个生成词元的时长，测量时应说明客户端或服务端口径。例：客服助手 0.8 秒开始显示文字，整段回答 6 秒结束。TTFT 反映开始响应的等待体验。','P95 Latency|P95延迟|P95 延迟是约 95% 请求不超过的延迟值。例：P95 为 4 秒，意味着较慢的约 5% 请求耗时超过这一水平。报告时需注明时间窗口、流量规模和测的是首字还是完整响应。'],['答案忠实引用了一份过时制度，它一定正确吗？','一定正确','不一定','只要引用就正确',1,'有据性与事实正确性是不同的维度。']],
['AI 工程与部署','理解产品如何运行','API 是应用之间的接口；Dify 负责应用编排，Ollama 提供本地模型推理服务，Docker 用于容器化部署。日志用于追踪问题，流式输出改善等待体验，但不一定缩短总耗时。','用户界面 → Dify → API → Ollama → 模型','记录一次模型调用的请求、响应、错误状态、延迟；画出本地系统架构。',['API|应用程序接口|API 是系统间约定的调用接口，定义请求参数、鉴权、返回内容和错误处理。例：工作流传入订单号，查询接口返回金额与状态。设计接入前需核对权限、限流、重试和接口版本。','API Key|接口密钥|API Key 是用于识别或授权调用方的凭据，经常由服务端随请求发送。例：后端调用模型服务时从保密配置读取密钥。应限制密钥权限，避免写入前端、代码仓库或日志，并支持轮换。','Endpoint|接口地址|端点是服务暴露某项能力的访问位置，HTTP API 通常要结合域名、路径和方法理解。例：同一路径的 GET 用于读取，POST 可能用于创建。测试时要确认环境、版本和请求方法。','HTTP|传输协议|HTTP 定义客户端和服务器如何交换请求与响应，包括方法、头部、状态码和正文。例：查询成功可能返回 200，限流常返回 429。HTTPS 为 HTTP 提供加密传输，业务仍需做权限检查。','JSON|数据交换格式|JSON 是文本数据格式，支持对象、数组、字符串、数字、布尔值和 null。例：订单接口可用对象返回订单号和状态。读取模型生成的 JSON 时先解析，再检查字段类型和业务约束。','SDK|开发工具包|SDK 是开发工具包，常封装鉴权、请求、流式解析和错误处理。例：用模型服务的 SDK 接收流式响应，减少手写协议。接入时仍需了解默认超时、重试方式和版本兼容性。','Webhook|事件回调|Webhook 是事件发生后，服务主动向配置好的地址发送通知。例：支付系统在退款完成后通知订单服务。接收端应验证消息来源，并按事件 ID 去重，防止重发触发重复动作。','Streaming|流式输出|流式输出是在全部结果完成前陆续发送数据片段。例：聊天页边收边展示文字，用户更早看到回应。实现时要区分网络分片与词元，并处理断流、取消和最终完成状态。','SSE|服务器发送事件|SSE 是服务器通过 HTTP 持续向客户端推送文本事件的方式，可用于展示生成进度。例：浏览器收到一系列片段并拼接成答复。它是服务端到客户端的单向通道，提交输入通常走另一条请求。','Docker|容器工具|Docker 是构建、分发和运行容器镜像的工具体系。例：把 Web 服务及依赖打成镜像，让测试和生产按同一版本启动。数据持久化、密钥以及宿主机驱动仍需单独配置。','Container|容器|容器是由镜像启动的隔离运行实例，拥有各自的进程与文件系统视图。例：同一镜像启动两个 API 副本应对并发。需要长期保留的数据应放到持久卷或外部存储。','Image|镜像|镜像是启动容器所用的软件与依赖模板，通常由只读层组成。例：发布时固定某个镜像摘要，确保测试与线上运行同一版本。运行后的临时文件属于容器状态。','GPU|图形处理器|GPU 适合并行执行大量类似的数值运算，可加速模型训练和推理。例：把模型服务迁到 GPU 后可比较吞吐量和延迟。真实性能还取决于显存、精度、批处理与软件支持。','VRAM|显存|显存是 GPU 用于保存权重、中间结果和推理缓存的内存。例：模型能加载在 16 GB 显存里，也可能在长上下文或多人并发时耗尽空间。容量验证应使用目标上下文长度和并发量。','Rate Limit|限流|限流是在单位时间或并行范围内限制用户或系统请求量。例：每个租户每分钟最多 60 次调用，达到上限后返回可重试提示。产品需定义限流维度及等待、排队或降级体验。','Cache|缓存|缓存把可复用结果或中间数据放在更快的位置，减少重复计算和访问。例：缓存稳定的帮助文档向量；政策更新后刷新相关缓存。含用户权限的数据，缓存键和访问控制要包含授权边界。','Log|日志|日志记录运行事件及其上下文，例如请求 ID、节点耗时和错误码。例：用请求 ID 串联检索与生成步骤，定位某次客服响应为何超时。日志应做敏感信息脱敏，并约定保留期限。','QPS|每秒查询数|QPS 是选定时间窗口内的平均每秒查询或请求数。例：10 秒收到 300 次查询，平均为 30 QPS。报告要区分入口请求和成功处理量，并结合峰值、延迟和错误率看容量。','Concurrency|并发|并发是同一时间内处于处理状态的请求或任务数量。例：20 个用户同时等待生成时，系统可能有 20 个在途请求。吞吐量一定时，处理越慢，在途数量通常越高，需要排队或容量保护。'],['流式输出一定降低完整回答生成时间吗？','是','否','只要是本地模型就会',1,'流式输出主要改善首屏等待和交互体验。']],
['产品设计与需求分析','从用户痛点到可验证产品','从用户访谈识别任务与痛点，定义目标人群、场景和成功标准，再设计 MVP。PRD 要明确正常流程、异常流程、数据权限及 AI 质量验收标准。优先级可以用 RICE 等框架，但分数需要真实依据。','调研 → 需求 → MVP → PRD → 原型 → 验收','为运营助手撰写一页 PRD：用户、问题、范围、流程、验收指标、非目标。',['Pain Point|痛点|痛点是用户完成任务时反复遇到且代价明显的困难。例：运营每天花两小时人工核对退款，遇到错账还要重查。访谈应追问频率、影响和现有补救方式，确认值得优先解决。','User Persona|用户画像|用户画像是基于真实研究归纳的典型用户描述，重点是目标、行为和约束。例：运营主管每天看异常周报，需要追溯依据但没有 SQL 技能。画像应直接影响功能或流程决策。','JTBD|待完成任务|JTBD 从用户想取得的进展来理解需求。例：「月底结账前，我想快速核清退款差异，避免财务返工。」对照人工表格、外包和自动化等现有方式，可以看出用户真正重视的结果。','User Journey|用户旅程|用户旅程串起用户完成目标前、中、后的步骤、触点和感受。例：从发现账单差异、寻找数据，到提交复核和收到结果。用访谈与日志标出等待、返工与掉队点。','User Story|用户故事|用户故事用简短描述连接角色、行动和价值。例：「作为财务同事，我想看到差额对应的原始订单，以便快速复核。」配套验收条件应说明有订单、无订单和无权限时的行为。','MVP|最小可行产品|最小可行产品用足够完成核心任务的一组功能，验证最重要的产品假设。例：先让运营上传两张表并得到可复查的差异报告，再观察是否节省时间。要预先定义成功标准和试用对象。','PRD|产品需求文档|产品需求文档描述要解决的问题、目标用户、功能范围、流程、异常和验收。例：对账助手 PRD 需写清如何匹配订单、缺字段怎么办、谁能看报告以及允许的差错范围。','MRD|市场需求文档|市场需求文档描述目标市场、客群需求、竞争或替代方案，以及机会证据。例：比较不同商家规模在对账频率、工具预算和未满足需求上的差异，为优先进入哪个市场提供依据。','BRD|商业需求文档|商业需求文档面向业务决策者，说明投入动机、预期业务结果、范围和约束。例：立项时明确减少月结人工时的目标、预算、风险与负责人，为是否投入提供依据。','Prototype|原型|原型是用来演示和验证交互的模型，可以是低保真草图或可点击页面。例：用模拟数据演示上传、查看差异和复核，观察用户能否找到依据。测试前要说明哪些数据或动作是模拟的。','Wireframe|线框图|线框图强调页面的信息层级、区域布局和主要控件。例：在对账页画出筛选区、差异表和详情侧栏，先验证能否找到结果和证据，再确定视觉样式。','User Flow|用户流程|用户流程描述完成任务时的入口、操作、判断、分支和结束状态。例：上传账单后先校验，失败则指出错误行，成功则生成报告。评审时应走一遍异常、返回和恢复路径。','Roadmap|路线图|路线图表达未来一段时间内的产品目标、重点和顺序。例：先降低对账耗时，再扩展渠道，最后推进自动化复核。对外沟通时应标明依赖和时间承诺的确定程度。','Backlog|需求待办|需求待办是尚未完成的功能、缺陷、实验或技术工作清单，通常带优先级。例：「支持多渠道账单」可拆成解析、校验和验收条目，定期按价值、证据和依赖调整顺序。','Acceptance Criteria|验收标准|验收标准是可以观察或测试的通过条件。例：「上传缺失订单号的 CSV 时，页面显示错误行号并允许重新上传。」可按前置条件、操作和预期结果描述，再覆盖异常分支。','RICE|优先级模型|RICE 按覆盖人数×影响程度×信心÷投入估算优先级。例：季度覆盖 1,000 人、影响 2、信心 80%、投入 4 人月，得分为 400。比较时应使用相同时间窗口和估算口径。','KANO|需求分类模型|KANO 按某项功能存在和缺失时对满意度的影响来归类。例：金额正确属于基础需求，复核更快可能是期望需求，自动提示历史相似异常可能带来惊喜。通常用正反问卷验证分类。','MoSCoW|优先级分类|MoSCoW 把需求按本次交付中的必要性分成必须、应该、可以、本期不做。例：准确核算属于必须，批量导出属于应该，主题切换可延后。应由相关方对同一发布范围达成一致。'],['MVP 最主要的目标是什么？','上线尽可能多的功能','低成本验证核心价值','使用最复杂的技术',1,'MVP 以验证关键假设为目标。']],
['数据分析与商业化','衡量产品价值与成本','产品指标应对应业务目标。AI 产品需要同时观察使用、任务成功、成本和风险。北极星指标应反映核心价值而非单纯请求数；本地模型虽无按次 API 费用，仍存在硬件、电力和维护成本。','目标 → 指标 → 埋点 → 分析 → 实验 → 决策','设计运营助手指标体系：成功完成对账次数、人工耗时、错误率及单任务成本。',['DAU|日活跃用户|DAU 是一个自然日或滚动日内，满足活跃定义的去重用户数。例：把运行对账或查看报告算作活跃，同一用户当天执行多次只计一人。报表应注明时区、去重 ID 和排除流量。','MAU|月活跃用户|MAU 是一个自然月或滚动 30 天内，满足活跃定义的去重用户数。例：一人整月处理 20 次账单也只计一人。比较月份或计算活跃黏性时，应对齐统计窗口和活跃定义。','CTR|点击率|点击率通常为点击次数÷曝光次数。例：入口展示 2,000 次，被点击 120 次，CTR 为 6%。分析前要定义有效曝光、重复点击怎样计数，并按入口位置或渠道分组。','CVR|转化率|转化率是完成指定动作的对象数除以符合统计条件的基数。例：500 名访问者中 40 名完成首单，访客首单转化率为 8%。应说明分母、转化事件与归因时间窗。','Retention|留存率|留存率衡量起始人群在后续指定时间仍满足活跃条件的比例。例：周一新增 100 人，其中 30 人恰好在第 7 天回访，第 7 日留存率为 30%。回访窗口需明确定义。','Churn|流失率|流失率衡量期初在用用户或客户中，于观察期内满足流失条件的比例。例：期初 200 家付费商户，月底 10 家取消且未续费，客户流失率为 5%。行为流失和订阅取消需要不同口径。','Funnel|漏斗|漏斗按有序步骤观察用户从开始到目标的转化与流失。例：1,000 人打开导入页、600 人上传、480 人生成报告，上传到报告的转化率为 80%。统计要定义事件顺序和完成时间窗。','Cohort|同期群|同期群是按共同起点或属性划分的一组用户，用于比较后续行为。例：按首次试用周分组，对比各组第 7 天留存。对比时应让各组经历相同的观察时长，避免新用户组被低估。','Event Tracking|埋点|埋点为关键行为记录事件与属性。例：报告生成事件可含请求 ID、状态和耗时。埋点方案还应说明触发条件、去重规则和数据校验方式，避免把点击当成执行成功。','NPS|净推荐值|净推荐值来自 0 到 10 分的推荐意愿题，计算为 9–10 分的推荐者占比减去 0–6 分的贬损者占比。例：两者分别是 55% 和 20%，则 NPS 为 35。7–8 分计入总样本。','CSAT|满意度|满意度衡量用户对某次体验或服务的主观评价。例：5 分量表中，把 4–5 分作为满意，100 人里 82 人达到阈值，CSAT 为 82%。比较时应使用相同题目、量表和调查时点。','North Star Metric|北极星指标|北极星指标用一个主要量化指标反映产品持续创造的用户价值。例：对账助手可跟踪每周通过复核的对账任务数，而调用量只描述使用过程。可同时观察差错率和成本作为约束。','ROI|投资回报率|投资回报率常用（可归因收益－投入成本）÷投入成本。例：一个季度节约 12 万元，实施与维护共投入 8 万元，ROI 为 50%。要对齐周期，并说明收益如何估算、包含哪些成本。','GMV|交易总额|GMV 是按约定范围统计的商品或服务成交金额。例：订单金额 1,000 元、退了 200 元，按扣退款口径净额为 800 元。分析要说明是否按支付、是否扣退款以及是否含税运费。','CAC|获客成本|客户获取成本是某期可归因的获客成本除以对应新增客户数。例：投入 5 万元获得 100 家付费商户，平均 CAC 为 500 元。要注明成本是否含销售人员，以及客户或线索的口径。','LTV|生命周期价值|客户生命周期价值估计一位客户在整个关系期内带来的累计价值，常看毛利贡献。例：平均每月贡献 80 元毛利、预计留存 10 个月，简化 LTV 为 800 元。应说明留存假设和成本口径。','ARPU|每用户平均收入|每用户平均收入是某期收入除以同一范围内的用户数。例：月收入 10 万元、月活跃用户 2,000 人，按月活口径 ARPU 为 50 元。只以付费用户为分母时应另行标明。','TAM/SAM/SOM|市场规模|TAM 是总可寻址市场，SAM 是按产品能力、地区或渠道可服务的部分，SOM 是一定时间内现实可获取的部分。例：从所有对账商家，缩到支持的电商渠道，再按销售覆盖和成交率估算近期份额。','PMF|产品市场匹配|产品市场匹配指产品能稳定满足特定市场的真实需求。例：目标商户持续复用对账工具、愿意付费并主动推荐，可结合续费、留存和访谈判断。应明确匹配的是哪类客户和场景。','POC|概念验证|概念验证用小规模实验测试一个关键可行性假设。例：用 20 份代表性账单检查能否高准确率提取必要字段。实验要先定通过线，结论对应本次测试范围，真实生产条件需另行验证。'],['企业运营助手更合适的核心价值指标是？','模型调用次数越多越好','成功完成的有效业务任务数','页面颜色数量',1,'有效任务完成更直接反映用户价值。']],
['AI 安全与治理','设计可信、可控的 AI 产品','安全不能只依赖提示词。知识检索需要权限过滤，工具操作要遵循最小权限，敏感数据需要脱敏与保护。建立日志、人工审核和风险测试机制。','识别风险 → 权限控制 → 输出检查 → 审计 → 改进','设计一组越权查询、提示词注入及无依据问题，测试系统是否拒绝或安全降级。',['AI Governance|AI治理|AI 治理是在立项、开发、上线和运营过程中明确责任、规则与审查。例：客服助手上线前登记用途和数据，审批权限，并设定事故负责人和回滚条件。治理要求需要落到可检查的记录。','Responsible AI|负责任AI|负责任 AI 把隐私、公平、可靠性和问责等要求落实到产品决策。例：上线工单分类前分群检查误判，保留人工复核和申诉入口。设计时应明确影响对象、评估指标和纠错责任。','Alignment|对齐|对齐关注模型行为是否符合预设目标、规范和人类意图。例：客服助手既要帮助用户，也要在依据不足时说明不确定，并避免擅自承诺。可用场景评估、反馈训练和外部控制共同改进。','Bias|偏见|偏见指系统对不同群体或表达方式产生系统性差异，可能来自数据、标签或模型。例：某种方言的投诉更常被误归为普通咨询。可分群比较误判率，并检查样本代表性和标注规则。','Content Moderation|内容审核|内容审核按明确规则识别并处置不合规内容，可在输入、输出或发布前执行。例：对疑似违规文本区分自动放行、阻拦和人工复核。要持续检查漏审与误拦，并提供申诉或纠错渠道。','Jailbreak|越狱|越狱指试图让模型绕过既定的行为限制或安全规则。例：安全评估可检查模型遇到伪装成合法请求的违规任务时是否遵守规则。应用还需在权限、输出检查和监控层建立保护。','Data Leakage|数据泄露|数据泄露指信息进入无权访问的对象或环境。例：知识助手误把另一部门的薪资表返回给当前用户。应在检索、缓存、日志和导出等环节检查隔离，并保留审计记录。','PII|个人可识别信息|个人可识别信息是能直接或结合其他字段识别个人的数据，例如身份证号、手机号或可关联的账户标识。例：用工单测试模型前先做最小化和脱敏，并检查输出与日志是否意外保留原值。','RBAC|角色权限控制|角色权限控制把权限赋给角色，再把角色分配给用户。例：运营可看自己门店的工单，审核员可批准退款。角色限制可与门店等资源范围结合，服务端对实际请求执行授权检查。','Audit Log|审计日志|审计日志记录谁在何时对什么对象做了什么、结果如何。例：保存退款审批人的身份、订单范围和操作结果。它用于追溯和问责，应限制访问、保护记录完整性，并定义保留期。','Explainability|可解释性|可解释性关注用户能否理解系统输出的主要依据和限制。例：风险标记显示来自哪些可核查的订单字段，以及哪些数据缺失。解释应贴合实际决策证据，避免用生成的理由替代核验。','Human Oversight|人工监督|人工监督让有权限的人监控、复核、纠正或停止 AI 的行为。例：审核员能查看证据、撤回有误分类并临时停用自动处理。产品应明确触发阈值、责任人和接管权限。'],['防止普通员工查询高管薪资，最可靠的第一道控制是？','仅在 Prompt 写禁止','检索和数据访问权限控制','提高 Top-K',1,'应在数据进入模型前执行访问权限控制。']]
];
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}, save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};let known=read('pm_known',{}),done=read('pm_done',{}),quiz=read('pm_quiz',{}),notes=read('pm_notes',{}),page='home',idx=0,filter='all',flip=false,flash=0;const terms=data.flatMap((m,i)=>m[5].map((x,j)=>({id:i+'-'+j,chapter:i,parts:x.split('|')})));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const app=document.getElementById('app');const count=()=>terms.filter(t=>known[t.id]).length;const pct=(a,b)=>Math.round(a/b*100);function nav(){document.getElementById('nav').innerHTML=[['home','学习总览'],['terms','专业词汇库'],['flash','记忆卡片'],['quiz','面试练习'],['project','Dify 实战项目'],['tools','产品工具箱'],...data.map((m,i)=>['c'+i,String(i+1).padStart(2,'0')+' · '+m[0]])].map(([k,t])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${esc(t)}</button>`).join('');document.getElementById('sideProgress').innerHTML=`已掌握 ${count()} / ${terms.length} 个词汇<br>完成 ${Object.values(done).filter(Boolean).length} / ${data.length} 章`;}function go(p){page=p;document.getElementById('search').value='';render();window.scrollTo(0,0)}function termHTML(t){return `<div class="term"><div><strong>${esc(t.parts[0])}</strong> · ${esc(t.parts[1])}<br><span class="muted">${esc(t.parts[2])}</span></div><button class="${known[t.id]?'known':''}" onclick="toggle('${t.id}')">${known[t.id]?'✓ 已掌握':'标记掌握'}</button></div>`}function toggle(id){known[id]=!known[id];save('pm_known',known);let q=document.getElementById('search').value;if(q)searchAll(q);else render();nav()}function render(){nav();if(page==='home'){app.innerHTML=`<div class="hero"><div class="tag">YOUR AI PRODUCT MANAGER PATH</div><h1>成为懂技术、懂用户的<br>AI 产品经理。</h1><p class="muted">从专业术语到真实项目，建立可用于面试的能力体系。</p><button class="btn" onclick="go('c${Math.max(0,data.findIndex((_,i)=>!done[i]))}')">继续学习 →</button></div><div class="grid"><div cla </strong></label><textarea placeholder="记录证据、结果及下一步…" oninput="note('project${i}',this.value)">${esc(notes['project'+i]||'')}</textarea></div>`).join('')}<button class="btn" onclick="exportNotes()">导出学习记录</button>`}else if(page==='tools'){app.innerHTML=`<h1>产品工具箱</h1><div class="card"><h3>RICE 优先级</h3><p class="muted">覆盖人数 × 影响力 × 信心 ÷ 人月</p>${field('reach','覆盖人数',1000)}${field('impact','影响力',2)}${field('conf','信心（%）',80)}${field('effort','投入（人月）',2)}<h2 id="rice"></h2></div><div class="card"><h3>Token 成本估算</h3><p class="muted">以下为模拟价格，可自行修改。仅计算模型调用费。</p>${field('users','日活用户',1000)}${field('calls','每日人均调用',10)}${field('it','输入 Token',2000)}${field('ot','输出 Token',500)}${field('ip','输入价（元/百万 Token）',2)}${field('op','输出价（元/百万 Token）',8)}<h2 id="cost"></h2></div><div class="card"><h3>数据备份</h3><p>进度与笔记保存在当前浏览器。建议定期导出。</p><button class="btn" onclick="exportNotes()">导出 JSON 学习记录</button></div>`;calc()}}function field(id,label,v){return `<label>${label} <input id="${id}" type="number" min="0" step="any" value="${v}" oninput="calc()" class="search" style="width:100%;min-width:0"></label>`}function calc(){let n=id=>Math.max(0,Number(document.getElementById(id).value)||0);document.getElementById('rice').textContent=n('effort')>0?'RICE 分数：'+(n('reach')*n('impact')*Math.min(100,n('conf'))/100/n('effort')).toFixed(2):'投入必须大于 0';document.getElementById('cost').textContent='月度模型成本：¥ '+(30*n('users')*n('calls')*(n('it')*n('ip')+n('ot')*n('op'))/1e6).toFixed(2)}function question(i){let q=data[i][6],a=quiz[i];return `<div class="card"><span class="pill">${data[i][0]}</span><h3>${q[0]}</h3>${q.slice(1,4).map((x,j)=>`<button class="option ${a!==undefined?(j===q[4]?'good':a===j?'bad':''):''}" onclick="choose(${i},${j})">${String.fromCharCode(65+j)}. ${x}</button>`).join('')}${a!==undefined?`<div class="answer"><strong>${a===q[4]?'回答正确':'需要复习'}</strong> · ${q[5]}</div>`:''}</div>`}function choose(i,j){quiz[i]=j;save('pm_quiz',quiz);render()}function complete(i){done[i]=!done[i];save('pm_done',done);render()}function note(k,v){notes[k]=v;save('pm_notes',notes)}function searchAll(s){if(!s.trim()){render();return}let q=s.toLowerCase();app.innerHTML=`<h1>搜索结果</h1><div class="card">${terms.filter(t=>t.parts.join(' ').toLowerCase().includes(q)||data[t.chapter][0].toLowerCase().includes(q)).map(termHTML).join('')||'未找到匹配词汇，请尝试其他关键词。'}</div>`}function exportNotes(){let blob=new Blob([JSON.stringify({known,done,quiz,notes},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ai-pm-learning-record.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}render();</script></body></html>
