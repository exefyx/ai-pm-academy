const data=[
['AI 与机器学习基础','理解不同 AI 技术适用的业务问题','AI 不是所有问题的最优解。确定性计算优先用规则或代码；有历史标签的预测任务可以用监督学习；开放式语言理解与生成适合考虑 LLM。训练集用于学习，验证集用于选择参数，测试集用于独立评估。','需求 → 判断任务类型 → 选择技术 → 验证效果','用 GMV 对账为例，金额计算使用 Python，异常原因解释才考虑大模型。',['AI|人工智能|让机器完成需要智能的任务','ML|机器学习|从数据学习规律','DL|深度学习|使用多层神经网络学习','AIGC|生成式 AI 内容|生成文本、图片等','NLP|自然语言处理|理解与生成语言','CV|计算机视觉|处理图像和视频','Multimodal|多模态|处理多种信息形式','Supervised Learning|监督学习|使用带标签数据学习','Unsupervised Learning|无监督学习|发现未标注数据的结构','Reinforcement Learning|强化学习|根据奖励学习策略','Classification|分类|预测离散类别','Regression|回归|预测连续数值','Clustering|聚类|发现相似样本群','Training Set|训练集|用于拟合模型','Validation Set|验证集|用于模型和参数选择','Test Set|测试集|用于独立效果评估','Overfitting|过拟合|训练好但泛化差','Generalization|泛化|处理未见数据的能力','Loss Function|损失函数|衡量预测与目标的差距','CNN|卷积神经网络|常用于图像特征提取'],['精确计算订单差额应该优先使用什么？','大模型自由生成','Python 确定性计算','图像分类',1,'金额对账需要可重复、可审计的精确结果。']],
['大语言模型 LLM','理解模型原理、参数与选型','生成式 LLM 将输入切分为 Token，通过 Transformer 处理上下文并预测后续 Token。模型参数是训练得到的权重；上下文窗口是单次处理的信息容量。生成概率不等于事实真实性，因此需要评估与外部依据。','输入 → Tokenization → Transformer → 解码 → 输出','在 Ollama 中使用同一批问题比较不同可运行模型的质量、延迟和资源占用。',['LLM|大语言模型|学习语言规律的模型','Token|词元|文本处理基本单位','Tokenizer|分词器|将文本转换为词元','Transformer|模型架构|利用注意力机制处理信息','Attention|注意力机制|计算信息间关联','Parameter|参数|训练学习的权重','Context Window|上下文窗口|一次可处理的词元范围','Embedding|向量嵌入|用向量表达信息语义','Pre-training|预训练|学习通用规律','SFT|监督微调|用示例调整模型行为','Fine-tuning|微调|继续训练模型参数','LoRA|低秩适配|降低微调资源需求','RLHF|人类反馈强化学习|使用人类偏好优化行为','DPO|直接偏好优化|直接利用偏好数据训练','Hallucination|幻觉|生成错误或无依据内容','Inference|推理|使用模型产生结果','Temperature|温度|调节生成随机性','Top-p|核采样|限制候选词元累计概率','MoE|混合专家|选择部分专家网络计算','Quantization|量化|降低数值精度节省资源','Distillation|蒸馏|迁移模型能力'],['降低 Temperature 能保证消除幻觉吗？','能','不能','只要模型足够大就能',1,'降低随机性不等于提高事实真实性。']],
['Prompt 工程','控制输出结构与行为','好的提示词包含角色、任务、上下文、约束、输出格式和示例。将提示词作为可版本化的产品配置，通过固定测试集比较效果。结构化输出还需要程序校验，不能只依靠文字要求。','角色 → 任务 → 背景 → 约束 → 格式 → 测试','在 Dify 设计运营助手 Prompt，要求输出结论、依据和不确定性；比较两个版本。',['Prompt|提示词|给模型的指令','System Prompt|系统提示词|定义角色与规则','User Prompt|用户提示词|用户输入','Zero-shot|零样本|不提供示例','Few-shot|少样本|提供少量示例','CoT|思维链|多步骤推理方法','Prompt Template|提示词模板|复用指令结构','Structured Output|结构化输出|按指定结构生成','JSON Schema|JSON 模式|约束数据结构','Guardrails|防护机制|限制或检查行为','Prompt Injection|提示词注入|输入试图改变预设行为'],['要求 AI 输出 JSON 后，还应该做什么？','无需检查','程序校验格式和字段','只提高温度',1,'模型仍可能生成不合规数据，应进行校验和异常处理。']],
['RAG 与知识库','让答案具备可追溯依据','RAG 在生成前检索外部知识。离线阶段解析文档、切分、向量化并建立索引；在线阶段检索、可选重排并把资料交给模型。RAG 不修改模型权重，适合频繁更新的知识。','文档 → 切分 → 向量索引 → 检索 → 重排 → 生成','导入公开或模拟的运营制度，设置检索参数，用有答案与无答案的问题验证引用和拒答。',['RAG|检索增强生成|检索资料后生成回答','Knowledge Base|知识库|保存业务知识','Parsing|解析|提取文档内容','Chunk|文本块|切分后的文本片段','Chunk Size|分块大小|控制片段长度','Chunk Overlap|分块重叠|减少上下文丢失','Embedding Model|向量模型|生成语义向量','Vector Database|向量数据库|保存检索向量','Semantic Search|语义检索|按含义匹配','Keyword Search|关键词检索|按词汇匹配','Hybrid Search|混合检索|结合多种检索方式','Similarity|相似度|衡量信息关联','Top-K|前 K 个|检索结果数量','Rerank|重排序|重新排序候选资料','Metadata|元数据|文档时间、分类等','Query Rewrite|查询改写|优化检索表达','Citation|引用|指明信息来源','Groundedness|有据性|回答是否得到资料支持'],['公司报销政策频繁更新，优先采用哪种技术？','每次重新预训练','RAG','提高 Temperature',1,'更新知识库比反复训练模型更适合此场景。']],
['Agent 与 Workflow','设计多步骤 AI 任务','Workflow 的主要执行路径由设计者定义；Agent 可以根据目标和工具反馈动态决策。优先选择满足需求且可控的方案。涉及写入、发送或付款时应设计权限、人工确认、重试上限和审计。','目标 → 规划 → 工具调用 → 反馈 → 检查 → 完成','用 Dify 搭建上传订单表、代码核对、LLM 解释、报告输出的工作流。',['Agent|智能体|根据目标进行决策和行动','Workflow|工作流|预设步骤编排','Planning|规划|决定执行步骤','Task Decomposition|任务拆解|将任务分解为子任务','Tool Calling|工具调用|调用外部能力','Function Calling|函数调用|按结构请求执行函数','Memory|记忆|保存相关任务上下文','ReAct|推理与行动|结合行动反馈进行决策','Multi-Agent|多智能体|多个智能体协作','MCP|模型上下文协议|标准化连接外部工具与资源','Human-in-the-loop|人在回路|关键节点人工审核','Fallback|降级方案|失败时使用替代方案','Retry|重试|失败后重新执行','Router|路由|选择处理路径','State|状态|记录任务进展'],['固定的财务对账流程优先采用什么？','完全自主 Agent','确定性 Workflow','无任何检查的聊天机器人',1,'固定流程更易测试、控制和审计。']],
['AI 效果评估','建立可复现的效果证据','评估需要区分检索质量、答案质量、任务成功率与工程性能。建立黄金测试集，定义评分规则，对失败案例分类并优化。LLM-as-a-Judge 可以辅助人工评估，但也需要校准。','测试集 → 基线 → 评估 → Bad Case → 优化 → 回归测试','建立至少50道测试题，记录正确性、有据性、拒答、延迟；用同一测试集对比两个版本，保留原始记录。',['Accuracy|准确率|正确结果占比','Precision|精确率|预测为正中真实为正的比例','Recall|召回率|真实正例被找到的比例','F1|F1分数|精确率与召回率的调和平均','Correctness|正确性|事实逻辑是否正确','Groundedness|有据性|回答是否有资料支持','Faithfulness|忠实性|回答是否忠于资料','Answer Relevance|答案相关性|是否回答了用户问题','Completeness|完整性|是否遗漏关键内容','Task Success Rate|任务成功率|成功任务比例','Hallucination Rate|幻觉率|按明确定义统计幻觉占比','Golden Dataset|黄金测试集|有标准答案或评判依据','Benchmark|基准测试|统一条件下测量能力','LLM-as-a-Judge|模型裁判|用模型辅助评分','Bad Case Analysis|失败案例分析|定位失败根因','Regression Testing|回归测试|检查优化是否损害已有能力','A/B Testing|对照实验|随机分组比较策略','TTFT|首词元时间|首个词元返回耗时','P95 Latency|P95延迟|95%请求不超过的延迟'],['答案忠实引用了一份过时制度，它一定正确吗？','一定正确','不一定','只要引用就正确',1,'有据性与事实正确性是不同的维度。']],
['AI 工程与部署','理解产品如何运行','API 是应用之间的接口；Dify 负责应用编排，Ollama 提供本地模型推理服务，Docker 用于容器化部署。日志用于追踪问题，流式输出改善等待体验，但不一定缩短总耗时。','用户界面 → Dify → API → Ollama → 模型','记录一次模型调用的请求、响应、错误状态、延迟；画出本地系统架构。',['API|应用程序接口|系统之间交互的约定','API Key|接口密钥|访问凭证','Endpoint|接口地址|服务访问位置','HTTP|传输协议|网络请求约定','JSON|数据交换格式|结构化文本','SDK|开发工具包|封装接口的工具','Webhook|事件回调|事件触发请求','Streaming|流式输出|分段返回结果','SSE|服务器发送事件|服务端单向事件流','Docker|容器工具|打包运行环境','Container|容器|隔离运行实例','Image|镜像|容器运行模板','GPU|图形处理器|加速并行运算','VRAM|显存|GPU 内存','Rate Limit|限流|限制请求频率','Cache|缓存|复用已有结果','Log|日志|记录系统行为','QPS|每秒查询数|请求处理速率','Concurrency|并发|同时处理任务'],['流式输出一定降低完整回答生成时间吗？','是','否','只要是本地模型就会',1,'流式输出主要改善首屏等待和交互体验。']],
['产品设计与需求分析','从用户痛点到可验证产品','从用户访谈识别任务与痛点，定义目标人群、场景和成功标准，再设计 MVP。PRD 要明确正常流程、异常流程、数据权限及 AI 质量验收标准。优先级可以用 RICE 等框架，但分数需要真实依据。','调研 → 需求 → MVP → PRD → 原型 → 验收','为运营助手撰写一页 PRD：用户、问题、范围、流程、验收指标、非目标。',['Pain Point|痛点|用户遇到的困难','User Persona|用户画像|目标用户描述','JTBD|待完成任务|用户真正想完成的目标','User Journey|用户旅程|完整使用过程','User Story|用户故事|描述用户目标与价值','MVP|最小可行产品|低成本验证核心价值','PRD|产品需求文档|定义需求与验收','MRD|市场需求文档|分析市场机会','BRD|商业需求文档|描述业务目标','Prototype|原型|展示交互','Wireframe|线框图|页面结构','User Flow|用户流程|操作路径','Roadmap|路线图|未来规划','Backlog|需求待办|待执行需求集合','Acceptance Criteria|验收标准|可验证的完成条件','RICE|优先级模型|覆盖×影响×信心÷投入','KANO|需求分类模型|基础、期望、魅力需求','MoSCoW|优先级分类|必须、应该、可选、暂不做'],['MVP 最主要的目标是什么？','上线尽可能多的功能','低成本验证核心价值','使用最复杂的技术',1,'MVP 以验证关键假设为目标。']],
['数据分析与商业化','衡量产品价值与成本','产品指标应对应业务目标。AI 产品需要同时观察使用、任务成功、成本和风险。北极星指标应反映核心价值而非单纯请求数；本地模型虽无按次 API 费用，仍存在硬件、电力和维护成本。','目标 → 指标 → 埋点 → 分析 → 实验 → 决策','设计运营助手指标体系：成功完成对账次数、人工耗时、错误率及单任务成本。',['DAU|日活跃用户|每日活跃人数','MAU|月活跃用户|每月活跃人数','CTR|点击率|点击数除以曝光数','CVR|转化率|转化数除以约定基数','Retention|留存率|用户后续仍活跃比例','Churn|流失率|用户流失比例','Funnel|漏斗|分析各流程转化','Cohort|同期群|按共同特征分组分析','Event Tracking|埋点|记录用户事件','NPS|净推荐值|推荐者比例减贬损者比例','CSAT|满意度|用户满意情况','North Star Metric|北极星指标|反映核心用户价值','ROI|投资回报率|收益相对于投入','GMV|交易总额|商品交易规模','CAC|获客成本|获取新用户成本','LTV|生命周期价值|用户生命周期贡献','ARPU|每用户平均收入|收入除以用户数','TAM/SAM/SOM|市场规模|总体、可服务、可获取市场','PMF|产品市场匹配|产品满足真实市场需求','POC|概念验证|验证技术或业务可行性'],['企业运营助手更合适的核心价值指标是？','模型调用次数越多越好','成功完成的有效业务任务数','页面颜色数量',1,'有效任务完成更直接反映用户价值。']],
['AI 安全与治理','设计可信、可控的 AI 产品','安全不能只依赖提示词。知识检索需要权限过滤，工具操作要遵循最小权限，敏感数据需要脱敏与保护。建立日志、人工审核和风险测试机制。','识别风险 → 权限控制 → 输出检查 → 审计 → 改进','设计一组越权查询、提示词注入及无依据问题，测试系统是否拒绝或安全降级。',['AI Governance|AI治理|风险管理与责任机制','Responsible AI|负责任AI|安全公平可靠地开发使用','Alignment|对齐|模型行为符合预期','Bias|偏见|系统性不公平倾向','Content Moderation|内容审核|识别不合规内容','Jailbreak|越狱|尝试绕过安全限制','Data Leakage|数据泄露|未经授权的信息暴露','PII|个人可识别信息|可识别个人的信息','RBAC|角色权限控制|按角色分配权限','Audit Log|审计日志|记录关键操作','Explainability|可解释性|理解模型决策依据','Human Oversight|人工监督|关键决策由人审核'],['防止普通员工查询高管薪资，最可靠的第一道控制是？','仅在 Prompt 写禁止','检索和数据访问权限控制','提高 Top-K',1,'应在数据进入模型前执行访问权限控制。']]

const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}, save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};let known=read('pm_known',{}),done=read('pm_done',{}),quiz=read('pm_quiz',{}),notes=read('pm_notes',{}),page='home',idx=0,filter='all',flip=false,flash=0;const terms=data.flatMap((m,i)=>m[5].map((x,j)=>({id:i+'-'+j,chapter:i,parts:x.split('|')})));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const app=document.getElementById('app');const count=()=>terms.filter(t=>known[t.id]).length;const pct=(a,b)=>Math.round(a/b*100);function nav(){document.getElementById('nav').innerHTML=[['home','学习总览'],['terms','专业词汇库'],['flash','记忆卡片'],['quiz','面试练习'],['project','Dify 实战项目'],['tools','产品工具箱'],...data.map((m,i)=>['c'+i,String(i+1).padStart(2,'0')+' · '+m[0]])].map(([k,t])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${esc(t)}</button>`).join('');document.getElementById('sideProgress').innerHTML=`已掌握 ${count()} / ${terms.length} 个词汇<br>完成 ${Object.values(done).filter(Boolean).length} / ${data.length} 章`;}function go(p){page=p;document.getElementById('search').value='';render();window.scrollTo(0,0)}function termHTML(t){return `<div class="term"><div><strong>${esc(t.parts[0])}</strong> · ${esc(t.parts[1])}<br><span class="muted">${esc(t.parts[2])}</span></div><button class="${known[t.id]?'known':''}" onclick="toggle('${t.id}')">${known[t.id]?'✓ 已掌握':'标记掌握'}</button></div>`}function toggle(id){known[id]=!known[id];save('pm_known',known);let q=document.getElementById('search').value;if(q)searchAll(q);else render();nav()}function render(){nav();if(page==='home'){app.innerHTML=`<div class="hero"><div class="tag">YOUR AI PRODUCT MANAGER PATH</div><h1>成为懂技术、懂用户的<br>AI 产品经理。</h1><p class="muted">从专业术语到真实项目，建立可用于面试的能力体系。</p><button class="btn" onclick="go('c${Math.max(0,data.findIndex((_,i)=>!done[i]))}')">继续学习 →</button></div><div class="grid"><div class="card"><span class="muted">章节进度</span><h1>${Object.values(done).filter(Boolean).length} / 10</h1><div class="bar"><i style="width:${pct(Object.values(done).filter(Boolean).length,10)}%"></i></div></div><div class="card"><span class="muted">词汇掌握</span><h1>${count()} / ${terms.length}</h1><div class="bar"><i style="width:${pct(count(),terms.length)}%"></i></div></div><div class="card"><span class="muted">测验正确章节数</span><h1>${Object.keys(quiz).filter(k=>quiz[k]===data[k][6][4]).length} / 10</h1><button class="btn secondary" onclick="go('quiz')">开始练习</button></div></div><h2>课程目录</h2><div class="grid">${data.map((m,i)=>`<div class="card click" onclick="go('c${i}')"><span class="pill">MODULE ${String(i+1).padStart(2,'0')} ${done[i]?' · 已完成':''}</span><h3 style="margin-top:12px">${m[0]}</h3><p class="muted">${m[1]}</p><span class="small">${m[5].length} 个词汇 · 1 个测验 · 实战任务 →</span></div>`).join('')}</div>`}else if(/^c\d+$/.test(page)){let i=Number(page.slice(1)),m=data[i];app.innerHTML=`<p class="muted">MODULE ${i+1} / 10</p><h1>${m[0]}</h1><p>${m[1]}</p><div class="card"><h3>核心知识</h3><p>${m[2]}</p><div class="flow">${m[3].split(' → ').map(x=>`<span>${x}</span>`).join(' → ')}</div></div><h2>专业词汇</h2><div class="card">${terms.filter(t=>t.chapter===i).map(termHTML).join('')}</div><h2>实战任务</h2><div class="card"><p>${m[4]}</p><textarea placeholder="记录你的实验结果、发现与改进…" oninput="note('${i}',this.value)">${esc(notes[i]||'')}</textarea></div><h2>章节测验</h2>${question(i)}<div class="row"><button class="btn" onclick="complete(${i})">${done[i]?'✓ 已完成（取消）':'标记章节完成'}</button>${i<9?`<button class="btn secondary" onclick="go('c${i+1}')">下一章 →</button>`:''}</div>`}else if(page==='terms'){app.innerHTML=`<h1>专业词汇库</h1><p class="muted">共 ${terms.length} 个专业词汇，中英文对照。</p><div class="row">${['all','unknown','known'].map((v,i)=>`<button class="btn ${filter===v?'':'secondary'}" onclick="filter='${v}';render()">${['全部','未掌握','已掌握'][i]}</button>`).join('')}</div><div class="card" style="margin-top:15px">${terms.filter(t=>filter==='all'||!!known[t.id]===(filter==='known')).map(termHTML).join('')||'暂无词汇'}</div>`}else if(page==='flash'){let pool=terms.filter(t=>!known[t.id]);if(!pool.length)pool=terms;let t=pool[flash%pool.length];app.innerHTML=`<h1>记忆卡片</h1><p class="muted">优先复习未掌握的词汇 · ${flash%pool.length+1} / ${pool.length}</p><div class="card" style="text-align:center;padding:60px 20px;cursor:pointer" onclick="flip=!flip;render()"><span class="pill">${flip?'答案':'点击翻面'}</span><h1>${esc(flip?t.parts[1]:t.parts[0])}</h1><p>${flip?esc(t.parts[2]):'尝试用自己的话解释这个概念'}</p></div><div class="row"><button class="btn secondary" onclick="flash=Math.max(0,flash-1);flip=false;render()">上一张</button><button class="btn secondary" onclick="flip=!flip;render()">翻面</button><button class="btn" onclick="known['${t.id}']=true;save('pm_known',known);flip=false;render()">掌握了 ✓</button><button class="btn secondary" onclick="flash++;flip=false;render()">下一张</button></div>`}else if(page==='quiz'){app.innerHTML=`<h1>面试练习</h1><p class="muted">先做10道基础情境题，再练习开放式面试问题。</p>${data.map((m,i)=>question(i)).join('')}<h2>开放式面试题</h2>${['如何选择大模型？','如何降低幻觉？','RAG、微调和 Prompt 有什么区别？','如何提升 RAG 检索质量？','如何评估 AI 产品？','如何设计 Agent 的异常处理？','如何平衡成本、速度与质量？','如何从零到一设计 AI 产品？','如何定义北极星指标？','如何用 STAR 讲述你的 Dify 项目？'].map((q,i)=>`<div class="card"><h3>${i+1}. ${q}</h3><textarea placeholder="写出你的面试回答：定义 → 原理 → 场景 → 权衡 → 案例" oninput="note('interview${i}',this.value)">${esc(notes['interview'+i]||'')}</textarea></div>`).join('')}`}else if(page==='project'){app.innerHTML=`<h1>Dify 实战项目</h1><div class="hero"><h2>企业智能运营助手</h2><p>用模拟电商数据，将 RAG、Workflow、数据分析和效果评估整合成一个可展示的作品集。</p></div>${['需求定义：访谈或梳理真实运营痛点，写出 MVP 范围','环境搭建：确认 Dify、Ollama 与本地模型接口正常','知识库：导入模拟制度，配置切分和检索','工作流：上传订单表，使用代码进行精确对账','评估：建立测试集，记录准确性、有据性和延迟','迭代：分析失败案例，调整参数并复测','安全：测试越权、异常输入与拒答机制','作品集：整理 PRD、架构、评估数据与项目复盘'].map((s,i)=>`<div class="card"><label><input type="checkbox" ${notes['task'+i]?'checked':''} onchange="note('task${i}',this.checked)"> <strong>${i+1}. ${s}</strong></label><textarea placeholder="记录证据、结果及下一步…" oninput="note('project${i}',this.value)">${esc(notes['project'+i]||'')}</textarea></div>`).join('')}<button class="btn" onclick="exportNotes()">导出学习记录</button>`}else if(page==='tools'){app.innerHTML=`<h1>产品工具箱</h1><div class="card"><h3>RICE 优先级</h3><p class="muted">覆盖人数 × 影响力 × 信心 ÷ 人月</p>${field('reach','覆盖人数',1000)}${field('impact','影响力',2)}${field('conf','信心（%）',80)}${field('effort','投入（人月）',2)}<h2 id="rice"></h2></div><div class="card"><h3>Token 成本估算</h3><p class="muted">以下为模拟价格，可自行修改。仅计算模型调用费。</p>${field('users','日活用户',1000)}${field('calls','每日人均调用',10)}${field('it','输入 Token',2000)}${field('ot','输出 Token',500)}${field('ip','输入价（元/百万 Token）',2)}${field('op','输出价（元/百万 Token）',8)}<h2 id="cost"></h2></div><div class="card"><h3>数据备份</h3><p>进度与笔记保存在当前浏览器。建议定期导出。</p><button class="btn" onclick="exportNotes()">导出 JSON 学习记录</button></div>`;calc()}}function field(id,label,v){return `<label>${label} <input id="${id}" type="number" min="0" step="any" value="${v}" oninput="calc()" class="search" style="width:100%;min-width:0"></label>`}function calc(){let n=id=>Math.max(0,Number(document.getElementById(id).value)||0);document.getElementById('rice').textContent=n('effort')>0?'RICE 分数：'+(n('reach')*n('impact')*Math.min(100,n('conf'))/100/n('effort')).toFixed(2):'投入必须大于 0';document.getElementById('cost').textContent='月度模型成本：¥ '+(30*n('users')*n('calls')*(n('it')*n('ip')+n('ot')*n('op'))/1e6).toFixed(2)}function question(i){let q=data[i][6],a=quiz[i];return `<div class="card"><span class="pill">${data[i][0]}</span><h3>${q[0]}</h3>${q.slice(1,4).map((x,j)=>`<button class="option ${a!==undefined?(j===q[4]?'good':a===j?'bad':''):''}" onclick="choose(${i},${j})">${String.fromCharCode(65+j)}. ${x}</button>`).join('')}${a!==undefined?`<div class="answer"><strong>${a===q[4]?'回答正确':'需要复习'}</strong> · ${q[5]}</div>`:''}</div>`}function choose(i,j){quiz[i]=j;save('pm_quiz',quiz);render()}function complete(i){done[i]=!done[i];save('pm_done',done);render()}function note(k,v){notes[k]=v;save('pm_notes',notes)}function searchAll(s){if(!s.trim()){render();return}let q=s.toLowerCase();app.innerHTML=`<h1>搜索结果</h1><div class="card">${terms.filter(t=>t.parts.join(' ').toLowerCase().includes(q)||data[t.chapter][0].toLowerCase().includes(q)).map(termHTML).join('')||'未找到匹配词汇，请尝试其他关键词。'}</div>`}function exportNotes(){let blob=new Blob([JSON.stringify({known,done,quiz,notes},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ai-pm-learning-record.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}render();</script></body></html>
